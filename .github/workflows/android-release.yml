name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: src/pve_flutter_frontend

      # The app depends on these two packages through ../ path dependencies,
      # so they must be checked out as siblings.
      - name: Checkout API client
        uses: actions/checkout@v4
        with:
          repository: ler-five/proxmox-dart-api-client-zh
          path: src/proxmox_dart_api_client

      - name: Checkout login manager
        uses: actions/checkout@v4
        with:
          repository: ler-five/proxmox-login-manager-zh
          path: src/proxmox_login_manager

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # built_value *.g.dart files are gitignored upstream, so they are
      # regenerated in every checkout before compiling.
      - name: Generate code (API client)
        working-directory: src/proxmox_dart_api_client
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate code (login manager)
        working-directory: src/proxmox_login_manager
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate code (app)
        working-directory: src/pve_flutter_frontend
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        working-directory: src/pve_flutter_frontend
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pve-companion-zh-apk
          path: src/pve_flutter_frontend/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/pve_flutter_frontend/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to a new release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            src/pve_flutter_frontend/build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "中文版 APK ${TAG}" \
            --notes "由 GitHub Actions 自动构建（run #${{ github.run_number }}）。
          构建分支：${{ github.ref_name }}
          提交：${{ github.sha }}

          注意：本 APK 使用 CI 的 debug 密钥签名，可直接安装；如需与本地正式签名版本覆盖升级，请先卸载旧版本。"
